 var got=false;pc.ontrack=function(e){$("rv").srcObject=e.streams[0];if(got)return;got=true;startTimer()};pc.onconnectionstatechange=function(){if(pc&&pc.connectionState==="failed")endCall(true)}}
function flush(){if(!pc)return;iceQ.forEach(function(c){pc.addIceCandidate(c).catch(function(){})});iceQ=[]}
function onSig(d){if(!callRow||!d)return;
 if(d.t==="offer"){mkPc();pc.setRemoteDescription(d.sdp).then(function(){flush();return pc.createAnswer()}).then(function(a){return pc.setLocalDescription(a)}).then(function(){sendSig({t:"answer",sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}})}).catch(function(){endCall(true)})}
 else if(d.t==="answer"&&pc){pc.setRemoteDescription(d.sdp).then(flush).catch(function(){})}
 else if(d.t==="ice"){if(pc&&pc.remoteDescription)pc.addIceCandidate(d.c).catch(function(){});else iceQ.push(d.c)}}
function callUpd(r){
 if(callRow&&r.id===callRow.id){callRow=r;
  if(r.status==="accepted"&&role==="caller"&&!pc){stopRing();$("ct").textContent="Соединение…";mkPc();pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).then(function(){sendSig({t:"offer",sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}})}).catch(function(){endCall(true)})}
  else if(["declined","ended","missed","busy"].indexOf(r.status)>=0){if(r.status==="declined"||r.status==="busy")toast(r.status==="busy"?"Занято":"Друг отклонил звонок");endCall(false)}}
 else if(pend&&pend.row&&pend.row.id===r.id&&r.status!=="ringing"){stopRing();pend=null;$("inc").classList.remove("on")}}
function startCall(v){if(call||!active)return;var n=active;
 if(S.demo&&n==="chatly_bot"){ring("out");fake();$("ct").textContent="Вызываем…";setTimeout(function(){if(call&&cw===n&&!tmr)startTimer()},2800);return}
 if(!idOf[n])return;
 gm(v).then(function(){return sb.from("calls").insert({from_id:myId,to_id:idOf[n],video:v}).select().single()}).then(function(r){if(r.error)throw 0;callRow=r.data;role="caller";iceQ=[];showCall(n,v,online[n]?"Вызываем…":"Звоним… отправили сигнал на телефон");ring("out");subCall(callRow.id);var id=callRow.id;
  setTimeout(function(){if(callRow&&callRow.id===id&&callRow.status==="ringing"&&!pc){sb.from("calls").update({status:"missed"}).eq("id",id).then(function(){});endCall(false);toast("Друг не ответил")}},45000)}).catch(function(){endCall(false);alert("Нужен доступ к микрофону и камере и подключение к интернету.")})}
function endCall(nt){var was=!!call;stopRing();clearInterval(tmr);tmr=null;if(wl){try{wl.release()}catch(e){}wl=null}
 if(nt&&callRow&&sb&&!S.demo)sb.from("calls").update({status:"ended"}).eq("id",callRow.id).then(function(){});
 if(pc){try{pc.close()}catch(e){}}pc=null;if(cch&&sb)sb.removeChannel(cch);cch=null;callRow=null;role="";iceQ=[];call=null;cw=null;
 if(ls_){ls_.getTracks().forEach(function(t){t.stop()});ls_=null}$("rv").srcObject=null;$("call").classList.remove("on");if(was)snd("end")}
function inCall(r){if(r.status!=="ringing"||Date.now()-Date.parse(r.created_at)>45000)return;
 if(call||pend){sb.from("calls").update({status:"busy"}).eq("id",r.id).then(function(){});return}
 function go(){var n=nickOf[r.from_id];if(!n)return;pend={row:r,n:n};setAv($("iav"),dn(n),S.prof_of[n]);$("inct").textContent=(r.video?"📹 Видеозвонок · ":"📞 Звонок · ")+dn(n);$("inc").classList.add("on");ring("in");notify(r.video?"📹 Видеозвонок":"📞 Звонок",dn(n),"call",true)}
 if(nickOf[r.from_id])go();else addByUid(r.from_id).then(go)}
$("yes").onclick=function(){var p=pend;if(!p)return;stopRing();pend=null;$("inc").classList.remove("on");
 if(p.demo){fake();startTimer();return}
 var r=p.row;gm(r.video).then(function(){callRow=r;role="callee";iceQ=[];showCall(p.n,r.video,"Соединение…");return subCall(r.id)}).then(function(){return sb.from("calls").update({status:"accepted"}).eq("id",r.id)}).catch(function(){endCall(true)})};
$("no").onclick=function(){stopRing();var p=pend;pend=null;$("inc").classList.remove("on");if(p&&!p.demo)sb.from("calls").update({status:"declined"}).eq("id",p.row.id).then(function(){})};
$("bv").onclick=function(){startCall(false)};$("bc").onclick=function(){startCall(true)};$("end").onclick=function(){endCall(true)};
function tog(b,k){b.onclick=function(){if(!ls_)return;var on=true;ls_.getTracks().forEach(function(t){if(t.kind===k){t.enabled=!t.enabled;on=t.enabled}});b.classList.toggle("off",!on)}}tog($("mic"),"audio");tog($("cam"),"video");

function demo(){me="demo";S=defS();S.set=Object.assign(S.set,ls("cl_set")||{});S.demo=true;S.stars=250;S.nfts=[7311553,90210,4162051,552277,31337];S.prof.name="Гость";S.contacts=["chatly_bot"];S.prof_of.chatly_bot={name:"Chatly Bot",bio:"Демо-друг",av:7311553,photo:null};online.chatly_bot=true;st.chatly_bot={ok:true};
 S.hist.chatly_bot=[{text:"Привет! Я демо-бот 👋 Здесь можно всё попробовать без регистрации.",t:Date.now()},{text:"Напиши мне, нажми 📞 или 📹, открой ⭐ и создай NFT, а в профиле поставь своё фото. Скоро я тебе позвоню 😉",t:Date.now()}];
 applyTheme();$("login").style.display="none";show("chats");snd("ok");toast("Демо-режим: друзья здесь — бот");
 setTimeout(function(){if(S&&S.demo&&!call&&!pend){pend={demo:true,n:"chatly_bot",row:{id:-1}};setAv($("iav"),"Chatly Bot",S.prof_of.chatly_bot);$("inct").textContent="📞 Звонок · Chatly Bot";$("inc").classList.add("on");ring("in");notify("📞 Звонок","Chatly Bot","call",true)}},9000)}
/* ---------- login ---------- */
function boot(sess){myId=sess.user.id;
 sb.from("profiles").select("*").eq("id",myId).single().then(function(r){
  if(r.error||!r.data){$("err").textContent="Профиль не найден. Проверьте, что выполнили schema.sql";return sb.auth.signOut()}
  var p=r.data;me=p.nick;S=defS();S.set=Object.assign(S.set,ls("cl_set")||{});applyP(p);applyTheme();$("login").style.display="none";$("go").disabled=false;show("chats");snd("ok");
  return loadContacts().then(loadHist).then(function(){startPresence();startRT();
   var q=new URLSearchParams(location.search),a=clean(q.get("add")||""),o=clean(q.get("open")||"");if(a&&a!==me)addFriend(a);else if(o&&idOf[o])openChat(o);
   sb.from("calls").select("*").eq("to_id",myId).eq("status","ringing").gt("created_at",new Date(Date.now()-40000).toISOString()).order("created_at",{ascending:false}).limit(1).then(function(c){if(c.data&&c.data[0])inCall(c.data[0])});
   if("Notification" in window&&Notification.permission==="granted")pushSub()})})}
function auth(reg){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
 var n=clean($("nick").value),p=$("pw").value;if(!sb){$("err").textContent="Сервер не настроен. Откройте демо или заполните ключи Supabase.";return}
 if(n.length<3||p.length<6){$("err").textContent="Логин от 3 символов (a-z, 0-9, _), пароль от 6";return}
 $("err").textContent="Подождите…";var em=n+"@chatly.app",q=reg?sb.auth.signUp({email:em,password:p,options:{data:{nick:n}}}):sb.auth.signInWithPassword({email:em,password:p});
 q.then(function(r){if(r.error){var m=r.error.message||"";$("err").textContent=/already|registered/i.test(m)?"Этот логин уже занят":/Invalid login/i.test(m)?"Неверный логин или пароль":m;return}
  if(!r.data.session){$("err").textContent="В Supabase отключите Confirm email (см. инструкцию)";return}$("err").textContent="";boot(r.data.session)}).catch(function(){$("err").textContent="Нет связи с сервером"})}
$("go").onclick=function(){auth(false)};$("reg").onclick=function(){auth(true)};$("demo").onclick=demo;
$("pw").onkeydown=function(e){if(e.key==="Enter")auth(false)};
$("nav").onclick=function(e){var b=e.target.closest("button");if(b)show(b.dataset.v)};
setInterval(function(){if(S&&!S.demo&&myId&&S.contacts.length)fetchProfiles(S.contacts.map(function(n){return idOf[n]}).filter(Boolean))},60000);
if(cfgOk()&&window.supabase){sb=supabase.createClient(SB_URL,SB_KEY);sb.auth.getSession().then(function(r){if(r.data&&r.data.session)boot(r.data.session)})}else{$("err").textContent="Сервер не настроен: работает только демо"}
})();
